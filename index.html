<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supernatural Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Manrope:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient-glow"></div>
    <header class="topbar">
      <div>
        <p class="eyebrow">Field Archive 07</p>
        <h1>Supernatural Map</h1>
      </div>
      <p class="subtitle">Track legends, anomalies, and unstable zones in real time.</p>
    </header>

    <main class="layout">
      <section class="panel controls">
        <h2>Scan Controls</h2>
        <label class="input-block">
          <span>Search</span>
          <input id="searchInput" type="search" placeholder="Name, region, or lore..." />
        </label>

        <label class="input-block">
          <span>Type</span>
          <select id="typeFilter">
            <option value="all">All Entities</option>
          </select>
        </label>

        <label class="input-block">
          <span>Era</span>
          <select id="eraFilter">
            <option value="all">All Eras</option>
          </select>
        </label>

        <label class="input-block">
          <span>Threat Level</span>
          <select id="threatFilter">
            <option value="all">All Levels</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="severe">Severe</option>
          </select>
        </label>

        <button id="resetFilters" class="reset-btn" type="button">Reset Scan</button>
      </section>

      <section class="panel map-panel">
        <div id="map" aria-label="Supernatural sightings map"></div>
      </section>

      <section class="panel details">
        <h2>Active Sightings</h2>
        <p id="resultCount" class="result-count"></p>
        <ul id="sightingList" class="sighting-list"></ul>
      </section>
    </main>

    <template id="sightingTemplate">
      <li class="sighting-item">
        <button class="sighting-button" type="button">
          <span class="sighting-title"></span>
          <span class="sighting-meta"></span>
          <span class="sighting-note"></span>
        </button>
      </li>
    </template>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="app.js"></script>
  </body>
</html>
